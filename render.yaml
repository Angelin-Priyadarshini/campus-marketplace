services:
  - type: web
    name: campusmart-backend
    env: python
    region: oregon
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      alembic upgrade head
      python -m app.seed
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campusmart-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_EMAIL_DOMAINS
        value: ssn.edu.in
      - key: ALLOW_ANY_EMAIL
        value: 'false'
      - key: AUTO_VERIFY
        value: 'true'
      - key: FRONTEND_ORIGIN
        value: https://campusmart.vercel.app
      - key: ADMIN_EMAIL
        value: admin@ssn.edu.in
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: campusmart-db
    databaseName: campusmart
    user: campusmart
    plan: free
